services:
  api:
    build: .
    environment:
      APP_ENV: dev
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+psycopg://cleverdocs:cleverdocs@db:5432/cleverdocs
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_INDEX_PREFIX: cleverdocs
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /app/storage
      JWT_SECRET: change-me
      JWT_ALGORITHM: HS256
    volumes:
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      - db
      - opensearch

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cleverdocs
      POSTGRES_PASSWORD: cleverdocs
      POSTGRES_DB: cleverdocs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "ChangeMe123!"
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"

volumes:
  pgdata:

