[project]
name = "cleverdocs"
version = "0.1.0"
description = "CleverDocs — moteur de recherche documentaire intelligent (DDD/CQRS, multi-tenant)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "CleverDocs" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "httpx>=0.27",
  "passlib[bcrypt]>=1.7.4",
  "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.2",
]
ocr = [
  "easyocr>=1.7.1",
  "pillow>=10.0",
  "pymupdf>=1.24",
]

[tool.ruff]
line-length = 100
target-version = "py311"

